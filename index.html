<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SML3004 YAP</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; line-height: 1.5; }
    .pin-section { margin-top: 32px; padding-top: 20px; border-top: 1px solid #ddd; }
    .pin-section label { display: block; font-weight: 600; margin-bottom: 8px; }
    #pinNumber { width: 130px; padding: 10px; font-size: 18px; letter-spacing: 6px; }
    #pinMessage { margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
  <h1>SML3004 - Video Post</h1>
  <p>Reflection on your YA</p>

  <div class="pin-section">
    <label for="pinNumber">PIN Number</label>
    <input id="pinNumber" name="pinNumber" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="4 digits" aria-describedby="pinMessage">
    <div id="pinMessage">Enter a 4-digit PIN Number.</div>
  </div>

  <script>
    const pin = document.getElementById('pinNumber');
    const message = document.getElementById('pinMessage');
    pin.addEventListener('input', () => {
      pin.value = pin.value.replace(/\D/g, '').slice(0, 4);
      message.textContent = pin.value.length === 4 ? 'PIN Number entered.' : 'Enter a 4-digit PIN Number.';
    });
  </script>
</body>
</html>
